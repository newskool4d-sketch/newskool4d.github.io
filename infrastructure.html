    /* 카테고리별 커스텀 뱃지 스타일 */
    .badge-cat {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      color: #0f172a;
    }
    .badge-isec { background-color: var(--accent); }
    .badge-office { background-color: #f59e0b; }
    .badge-direct { background-color: var(--teal-light); }
    .badge-library { background-color: var(--blue-light); color: #fff; }
    .badge-partner { background-color: #a855f7; color: #fff; } /* 보라색 연계체험처 */

    /* 리스트 카드 스타일 */
    .place-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }
    .place-card {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .place-card:hover, .place-card.active {
      background: rgba(30, 41, 59, 0.9);
      border-color: var(--teal-light);
      box-shadow: 0 4px 15px rgba(45, 212, 191, 0.1);
    }
    .place-card-name {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .place-card-desc {
      font-size: 13.5px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .place-card-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--text-sub);
    }
    .place-card-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .place-card-meta svg {
      color: var(--teal-light);
    }
  </style>
</head>

            </label>

        </div>

    let INFRA_DATA = FALLBACK_INFRA_DATA;
    const VALID_INFRA_CATEGORIES = new Set(["isec", "office", "direct", "library", "partner"]);
    const VALID_INFRA_REGIONS = new Set(["ganghwa", "yeongjong", "incheon-city"]);

    function isValidInfraRecord(place) {
      const normalizedTel = typeof place?.tel === "string"
        ? place.tel
        : typeof place?.phone === "string"
          ? place.phone
          : null;

      if (!(
        place &&
        typeof place.id === "string" &&
        typeof place.category === "string" &&
        typeof place.region === "string" &&
        typeof place.name === "string" &&
        typeof place.address === "string" &&
        typeof place.desc === "string" &&
        typeof normalizedTel === "string" &&
        typeof place.url === "string" &&
        VALID_INFRA_CATEGORIES.has(place.category) &&
        VALID_INFRA_REGIONS.has(place.region)
      )) return false;

      const hasPresetCoords = Number.isFinite(place.lat) && Number.isFinite(place.lng);
      const canUseGeocoderFallback = !("lat" in place) && !("lng" in place);
      return hasPresetCoords || canUseGeocoderFallback;
    }

    async function loadInfrastructureData() {
      try {
        const response = await fetch("data/infra.json", { cache: "no-store" });
        if (!response.ok) throw new Error("infra.json load failed");
        const loadedPlaces = await response.json();
        if (!Array.isArray(loadedPlaces)) throw new Error("infra data must be an array");
        const parsedPlaces = loadedPlaces
          .filter(isValidInfraRecord)
          .map(place => ({
            ...place,
            tel: typeof place.tel === "string" ? place.tel : place.phone
          }));
        if (parsedPlaces.length === 0) throw new Error("infra data is empty");
        INFRA_DATA = parsedPlaces;
      } catch {
        INFRA_DATA = FALLBACK_INFRA_DATA;
      }
    }

    let mapInstance = null;
    let markersMap = {}; // ID별 마커 및 지오코딩 완료된 정보 보관
    let activeOverlay = null;
    let lastPlaceOverlayTrigger = null;
    let _infraIdleTimer = null;
    let isInfrastructureMapReady = false;

    // 카테고리 명칭 맵
    const catNames = {
      isec: "학생교육원",
      office: "교육청",
      direct: "직속기관",
      library: "도서관",
      partner: "연계체험처"
    };

    function updateInfrastructureMapAvailability() {
      const fitButton = document.getElementById("fit-infra-btn");
      if (!fitButton) return;
      fitButton.disabled = !isInfrastructureMapReady;
      fitButton.setAttribute("aria-disabled", String(!isInfrastructureMapReady));
      fitButton.title = isInfrastructureMapReady
        ? "현재 필터 기준 기관 위치를 지도에 맞춰 표시합니다."
        : "카카오 JavaScript 키를 등록하면 지도 기능이 활성화됩니다.";
    }

    // 2. 초기 기동 함수
    window.addEventListener("DOMContentLoaded", async () => {
      // 공통 GNB 렌더링
      injectSharedGNB('infrastructure');
      bindInfrastructurePageEvents();

      await loadInfrastructureData();
      restoreInfraUrlState();
      filterAndRenderPlaces();
      updateInfrastructureMapAvailability();

      if (!getCachedKakaoKey()) {
        createLoaderCover(
          "🔑 카카오 JavaScript 키 등록 필요",
          "기관 목록은 먼저 확인할 수 있습니다. 지도 이동과 위치 마커를 보려면 카카오 Developers에서 발급한 JavaScript 키를 등록해주세요."
        );
        return;
      }

      // 카카오 SDK 기동 시도 및 지도 생성
      loadKakaoSDK(() => {
        initInfrastructureMap();
      });
    });

    function saveInfraUrlState() {
      const params = new URLSearchParams();
      [['chk-cat-isec','isec'],['chk-cat-office','office'],['chk-cat-direct','direct'],['chk-cat-library','library'],['chk-cat-partner','partner'],
       ['chk-reg-ganghwa','ganghwa'],['chk-reg-yeongjong','yeongjong'],['chk-reg-city','city']].forEach(([id, key]) => {
        const el = document.getElementById(id);
        if (el && !el.checked) params.set(key, '0');
      });
      if (mapInstance) {
        const c = mapInstance.getCenter();
        params.set('lat', c.getLat().toFixed(4));
        params.set('lng', c.getLng().toFixed(4));
        params.set('z', mapInstance.getLevel());
      }
      history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params.toString() : ''));
    }

    function restoreInfraUrlState() {
      const params = new URLSearchParams(location.search);
      [['chk-cat-isec','isec'],['chk-cat-office','office'],['chk-cat-direct','direct'],['chk-cat-library','library'],['chk-cat-partner','partner'],
       ['chk-reg-ganghwa','ganghwa'],['chk-reg-yeongjong','yeongjong'],['chk-reg-city','city']].forEach(([id, key]) => {
        const el = document.getElementById(id);
        if (el && params.has(key)) el.checked = params.get(key) !== '0';
      });
      const lat = parseFloat(params.get('lat'));
      const lng = parseFloat(params.get('lng'));
      const z = parseInt(params.get('z'), 10);
      const hasMapState = !isNaN(lat) && !isNaN(lng);
      if (hasMapState && mapInstance) mapInstance.setCenter(new kakao.maps.LatLng(lat, lng));
      if (!isNaN(z) && mapInstance) mapInstance.setLevel(z);
      return hasMapState;
    }

    function bindInfrastructurePageEvents() {
      const sidebarContent = document.querySelector(".sidebar-content");
      const listDom = document.getElementById("place-list-dom");

      sidebarContent.addEventListener("change", event => {
        if (event.target.matches("[data-action='filter-places']")) {
          filterAndRenderPlaces();
          saveInfraUrlState();
        }
      });

      listDom.addEventListener("click", event => {
        const card = event.target.closest("[data-action='focus-place']");
        if (!card || !listDom.contains(card)) return;
        focusPlace(card.dataset.placeId, card);
      });

      listDom.addEventListener("keydown", event => {
        const card = event.target.closest("[data-action='focus-place']");
        if (!card || (event.key !== "Enter" && event.key !== " ")) return;
        event.preventDefault();
        focusPlace(card.dataset.placeId, card);
      });

      document.addEventListener("click", event => {
        const closeButton = event.target.closest("[data-action='close-overlay']");
        if (closeButton) {
          closeOverlay();
        }
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && activeOverlay) {
          event.preventDefault();
          closeOverlay();
        }
      });
    }

    function registerInfrastructureMarker(place, coords) {
      let markerImageUrl = null;
      let markerImageSize = new kakao.maps.Size(31, 35);
      let markerImageOffset = new kakao.maps.Point(15, 35);
      if (place.category === 'isec') {
        markerImageUrl = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_yellow.png';
      } else if (place.category === 'office') {
        markerImageUrl = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png';
        markerImageSize = new kakao.maps.Size(24, 35);
        markerImageOffset = new kakao.maps.Point(12, 35);
      } else if (place.category === 'direct') {
        markerImageUrl = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png';
      }

      let markerOptions = {
        position: coords,
        map: mapInstance
      };

      if (markerImageUrl) {
        const markerImage = new kakao.maps.MarkerImage(
          markerImageUrl,
          markerImageSize,
          { offset: markerImageOffset }
        );
        markerOptions.image = markerImage;
      }

      const marker = new kakao.maps.Marker(markerOptions);
      kakao.maps.event.addListener(marker, 'click', () => {
        focusPlace(place.id);
      });

      markersMap[place.id] = {
        marker: marker,
        coords: coords,
        data: place
      };
    }

    function completeInfrastructureLoad(geoFailedNames) {
      const hadMapState = restoreInfraUrlState();
      filterAndRenderPlaces();
      if (!hadMapState) fitPlacesView();
      if (geoFailedNames.length > 0) {
        const host = document.getElementById("place-list-dom");
        showInlineStatus(host, `주소 변환 실패 ${geoFailedNames.length}건: ${geoFailedNames.join(", ")} — 해당 기관은 지도에 표시되지 않습니다.`, "error");
      }
    }

    function initInfrastructureMap() {
      const container = document.getElementById('map');
      const options = {
        center: new kakao.maps.LatLng(37.565, 126.54),
        level: 8
      };
      
      mapInstance = new kakao.maps.Map(container, options);
      isInfrastructureMapReady = true;
      applyStandardKakaoMapSettings(mapInstance);
      updateInfrastructureMapAvailability();

      initSidebarResizer(mapInstance);
      document.getElementById("fit-infra-btn").addEventListener("click", fitPlacesView);

      kakao.maps.event.addListener(mapInstance, 'idle', () => {
        clearTimeout(_infraIdleTimer);
        _infraIdleTimer = setTimeout(saveInfraUrlState, 600);
      });

      const geocoder = new kakao.maps.services.Geocoder();
      let pendingCount = INFRA_DATA.length;
      const geoFailedNames = [];

      if (pendingCount === 0) {
        completeInfrastructureLoad(geoFailedNames);
        return;
      }

      const finishPlace = () => {
        pendingCount--;
        if (pendingCount === 0) {
          completeInfrastructureLoad(geoFailedNames);
        }
      };

      INFRA_DATA.forEach(place => {
        if (Number.isFinite(place.lat) && Number.isFinite(place.lng)) {
          const coords = new kakao.maps.LatLng(place.lat, place.lng);
          registerInfrastructureMarker(place, coords);
          finishPlace();
          return;
        }

        geocoder.addressSearch(place.address, (result, status) => {
          if (status === kakao.maps.services.Status.OK) {
            const coords = new kakao.maps.LatLng(result[0].y, result[0].x);
            registerInfrastructureMarker(place, coords);
          } else {
            geoFailedNames.push(place.name);
          }
          finishPlace();
        });
      });
    }

    function updateInfraWorkflowStatus(count) {
      const activeCategoryCount = ["chk-cat-isec", "chk-cat-office", "chk-cat-direct", "chk-cat-library", "chk-cat-partner"]
        .filter(id => document.getElementById(id).checked).length;
      const activeRegionCount = ["chk-reg-ganghwa", "chk-reg-yeongjong", "chk-reg-city"]
        .filter(id => document.getElementById(id).checked).length;
      const mapSummary = isInfrastructureMapReady
        ? `${activeCategoryCount}유형 · ${activeRegionCount}권역`
        : `${activeCategoryCount}유형 · ${activeRegionCount}권역 · 목록 우선 표시`;

      document.getElementById("infra-category-chip-text").textContent = `${activeCategoryCount}유형`;
      document.getElementById("infra-region-chip-text").textContent = `${activeRegionCount}권역`;
      document.getElementById("infra-count-chip-text").textContent = `${count}개소`;
      document.getElementById("infra-map-summary").textContent = mapSummary;
      document.getElementById("infra-count-chip").classList.toggle("ready", count > 0);
    }

    function visiblePlaceCoords() {
      const filterCats = {
        isec: document.getElementById("chk-cat-isec").checked,
        office: document.getElementById("chk-cat-office").checked,
        direct: document.getElementById("chk-cat-direct").checked,
        library: document.getElementById("chk-cat-library").checked,
        partner: document.getElementById("chk-cat-partner").checked
      };

      const filterRegs = {
        ganghwa: document.getElementById("chk-reg-ganghwa").checked,
        yeongjong: document.getElementById("chk-reg-yeongjong").checked,
        "incheon-city": document.getElementById("chk-reg-city").checked
      };

      return INFRA_DATA
        .filter(place => filterCats[place.category] && filterRegs[place.region])
        .map(place => markersMap[place.id]?.coords)
        .filter(Boolean);
    }

    function fitPlacesView() {
      if (!mapInstance) return;
      const fallback = new kakao.maps.LatLng(37.565, 126.54);
      const coords = visiblePlaceCoords();
      const allCoords = Object.values(markersMap).map(item => item.coords);
      fitKakaoMapToCoords(mapInstance, coords.length ? coords : allCoords, fallback, 8);
    }

    /**
     * 필터를 적용하여 일치하는 카드 리스트를 그리고, 지도 위 마커 상태를 업데이트합니다.
     */
    function filterAndRenderPlaces() {
      // 1. 체크된 필터 상태 수집
      const filterCats = {
        isec: document.getElementById("chk-cat-isec").checked,
        office: document.getElementById("chk-cat-office").checked,
        direct: document.getElementById("chk-cat-direct").checked,
        library: document.getElementById("chk-cat-library").checked,
        partner: document.getElementById("chk-cat-partner").checked
      };

      const filterRegs = {
        ganghwa: document.getElementById("chk-reg-ganghwa").checked,
        yeongjong: document.getElementById("chk-reg-yeongjong").checked,
        "incheon-city": document.getElementById("chk-reg-city").checked
      };

      // 2. 해당 필터에 부합하는 장소들만 선별
      const filteredPlaces = INFRA_DATA.filter(place => {
        return filterCats[place.category] && filterRegs[place.region];
      });

      // 3. 카운터 개수 업데이트
      document.getElementById("places-count").textContent = `${filteredPlaces.length}개소`;
      updateInfraWorkflowStatus(filteredPlaces.length);

      // 4. 지도 위 마커 표시 여부 토글
      INFRA_DATA.forEach(place => {
        const item = markersMap[place.id];
        if (!item) return;

        const isVisible = filterCats[place.category] && filterRegs[place.region];
        if (isVisible) {
          item.marker.setMap(mapInstance);
        } else {
          item.marker.setMap(null);
        }
      });

      // 5. 사이드바 카드 목록 렌더링
      const listDom = document.getElementById("place-list-dom");
      listDom.innerHTML = "";

      if (filteredPlaces.length === 0) {
        listDom.innerHTML = `
          <div class="alert alert-warning" style="text-align: center;">
            선택한 조건에 부합하는 기관이 존재하지 않습니다.<br>위쪽 필터 설정을 변경해 보세요.
          </div>
        `;
        return;
      }

      filteredPlaces.forEach(place => {
        const card = document.createElement("div");
        card.id = `card-${place.id}`;
        card.className = "place-card";
        card.dataset.action = "focus-place";
        card.dataset.placeId = place.id;
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        
        const categoryKey = VALID_INFRA_CATEGORIES.has(place.category) ? place.category : "partner";
        const catClass = `badge-${categoryKey}`;
        const categoryLabel = catNames[categoryKey] || "기타";

        card.innerHTML = `
          <div class="place-card-name">
            <span>${escapeHtml(place.name)}</span>
            <span class="badge-cat ${catClass}">${escapeHtml(categoryLabel)}</span>
          </div>
          <div class="place-card-desc">${escapeHtml(place.desc)}</div>
          <div class="place-card-meta">
            <span>
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              ${escapeHtml(place.address)}
            </span>
          </div>
        `;
        listDom.appendChild(card);
      });
    }

    /**
     * 특정 기관을 클릭했을 때 포커스를 이동하고 커스텀 말풍선을 띄웁니다.
     * @param {string} id 
     */
    function focusPlace(id, triggerEl = null) {
      const resolvedTrigger = triggerEl?.closest?.("[data-action='focus-place']") || triggerEl;

      document.querySelectorAll(".place-card").forEach(c => c.classList.remove("active"));
      const activeCard = resolvedTrigger instanceof HTMLElement
        ? resolvedTrigger
        : document.getElementById(`card-${id}`);
      if (activeCard) {
        activeCard.classList.add("active");
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      if (!mapInstance) {
        showInlineStatus(
          document.getElementById("place-list-dom"),
          "기관 목록은 먼저 확인할 수 있습니다. 카카오 JavaScript 키를 등록하면 지도 이동과 상세 위치 팝업을 사용할 수 있습니다.",
          "info"
        );
        return;
      }

      const item = markersMap[id];
      if (!item) {
        showInlineStatus(
          document.getElementById("place-list-dom"),
          "선택한 기관의 지도 좌표를 아직 불러오지 못했습니다. 잠시 후 다시 시도해주세요.",
          "error"
        );
        return;
      }

      if (resolvedTrigger instanceof HTMLElement) {
        lastPlaceOverlayTrigger = resolvedTrigger;
      }

      // 1. 지도 시점 이동 (panTo)
      mapInstance.panTo(item.coords);

      // 2. 기존의 오버레이 제거
      if (activeOverlay) {
        activeOverlay.setMap(null);
      }

      // 3. 프리미엄 맞춤형 오버레이 콘텐츠 생성
      const popupDom = document.createElement("div");
      popupDom.className = "map-popup";
      const phoneMarkup = item.data.tel
        ? `
          <div class="map-popup-info-item">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.94.725l.548 2.2a1 1 0 01-.321.988l-1.305.98a10.582 10.582 0 004.872 4.872l.98-1.305a1 1 0 01.988-.321l2.2.548a1 1 0 01.725.94V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
            <span>대표전화: ${escapeHtml(item.data.tel)}</span>
          </div>`
        : "";
      popupDom.innerHTML = `
        <div class="map-popup-header">
          <strong>${escapeHtml(item.data.name)}</strong>
          <button type="button" class="map-popup-close" data-action="close-overlay" aria-label="기관 정보 닫기" style="background: none; border: none; padding: 0; line-height: 1;">✕</button>
        </div>
        <div class="map-popup-desc">${escapeHtml(item.data.desc)}</div>
        <div class="map-popup-info">
          <div class="map-popup-info-item">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <span>${escapeHtml(item.data.address)}</span>
          </div>
          ${phoneMarkup}
        </div>
        <a href="${escapeHtml(safeHttpUrl(item.data.url))}" target="_blank" rel="noopener noreferrer" class="map-popup-link-btn">
          <span>🌐 공식 홈페이지 방문</span>
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 00-2 2v4a2 2 0 002 2h10a2 2 0 002-2v-4a2 2 0 00-2-2h-4m8-12l-8 8m8-8v6m0-6h-6"/></svg>
        </a>
      `;

      // 4. 오버레이 인스턴스화 및 맵 로드
      activeOverlay = new kakao.maps.CustomOverlay({
        content: popupDom,
        position: item.coords,
        xAnchor: 0.5,
        yAnchor: 1.15,
        clickable: true
      });
      activeOverlay.setMap(mapInstance);
    }

    /**
     * 오버레이 닫기
     */
    function closeOverlay() {
      if (activeOverlay) {
        activeOverlay.setMap(null);
        activeOverlay = null;
      }
      document.querySelectorAll(".place-card").forEach(c => c.classList.remove("active"));
      if (lastPlaceOverlayTrigger instanceof HTMLElement && lastPlaceOverlayTrigger.isConnected) {
        lastPlaceOverlayTrigger.focus();
      }
    }
  </script>
</body>
</html>
